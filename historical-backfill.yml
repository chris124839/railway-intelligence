name: Historical backfill

on:
  workflow_dispatch:
    inputs:
      train:
        description: "Train number"
        required: true
        default: "17250"
      date_from:
        description: "Start date YYYY-MM-DD"
        required: true
      date_to:
        description: "End date YYYY-MM-DD"
        required: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install collector
        run: pip install -r collector/requirements.txt
      - name: Backfill requested dates
        run: |
          python scripts/backfill_dates.py \
            --train "${{ inputs.train }}" \
            --date-from "${{ inputs.date_from }}" \
            --date-to "${{ inputs.date_to }}"
        env:
          RAILRADAR_API_KEY: ${{ secrets.RAILRADAR_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
