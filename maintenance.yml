name: Railway maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: "15 18 * * *"

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate project
        run: python scripts/validate_project.py
      - name: Maintenance note
        run: echo "Maintenance check completed. Database cleanup and schedule-version maintenance will be added after the first live collection is verified."
