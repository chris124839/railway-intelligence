name: Daily train update

on:
  workflow_dispatch:
  schedule:
    # 06:30 IST = 01:00 UTC
    - cron: "0 1 * * *"

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install collector
        run: pip install -r collector/requirements.txt
      - name: Refresh configured train data
        run: python scripts/run_enabled_trains.py --mode daily
        env:
          RAILRADAR_API_KEY: ${{ secrets.RAILRADAR_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
