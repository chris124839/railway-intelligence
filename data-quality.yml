name: Data quality check

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate configuration
        run: python scripts/validate_project.py
