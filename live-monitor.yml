name: Railway live monitor

on:
  workflow_dispatch:
  schedule:
    # Once per hour. This is deliberately conservative for a 1,000-request/month API plan.
    - cron: "7 * * * *"

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install collector
        run: pip install -r collector/requirements.txt
      - name: Collect enabled live trains
        run: python scripts/run_enabled_trains.py --mode live
        env:
          RAILRADAR_API_KEY: ${{ secrets.RAILRADAR_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
